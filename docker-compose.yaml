# Only `alb` is published to the host (port 80). Everything else stays on private docker networks.
# For local debugging, expose a service on loopback only, e.g. mongo: ports: ["127.0.0.1:27017:27017"].

x-mongo-uri: &mongo-uri mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin&replicaSet=rs0
x-redis-url: &redis-url redis://:${REDIS_PASSWORD}@redis:6379/

services:
  backend:
    build: ./backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGODB_URI: *mongo-uri
      MONGO_DATABASE: ${MONGO_DATABASE:-prod}
      REDIS_URL: *redis-url
      SECRETS_MASTER_KEYS: ${SECRETS_MASTER_KEYS:?set SECRETS_MASTER_KEYS in .env}
      AUTH_SIGNING_KEYS: ${AUTH_SIGNING_KEYS:?set AUTH_SIGNING_KEYS in .env}
      PLATFORM_ADMINS: ${PLATFORM_ADMINS:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    networks:
      - mongo
      - redis
      - backend

  realtime:
    build: ./realtime
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGODB_URI: *mongo-uri
      MONGO_DATABASE: ${MONGO_DATABASE:-prod}
      REDIS_URL: *redis-url
      PORT: "3000"
    networks:
      - mongo
      - redis
      - realtime

  frontend:
    build:
      context: ./frontend
      dockerfile: dist/Dockerfile
    container_name: sveltekit-frontend
    networks:
      - frontend

  mongo:
    image: mongo:latest
    # Change streams (realtime service) need a replica set, which with auth needs a keyfile.
    command:
      - sh
      - -c
      - >-
        head -c 720 /dev/urandom | base64 -w0 > /data/keyfile &&
        chmod 400 /data/keyfile &&
        chown mongodb:mongodb /data/keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/keyfile --bind_ip_all
    healthcheck:
      # Initiates the single-node replica set on first run, healthy once it is ready
      test: >-
        mongosh --quiet
        -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
        --authenticationDatabase admin
        --eval "try { if (rs.status().ok !== 1) quit(1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-prod}
    networks:
      - mongo
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - redis

  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    profiles:
      - integration
    ports:
      - "8899:8080"

  alb:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - realtime
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
      - backend
      - realtime

networks:
  # internal: no outbound internet for containers that are only on these networks
  mongo:
    internal: true
  redis:
    internal: true
  frontend: {}
  backend: {}
  realtime: {}

volumes:
  mongo_data: {}
