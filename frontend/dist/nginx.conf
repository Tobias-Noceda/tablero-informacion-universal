# Nginx configuration for SvelteKit Static SPA
# Handles client-side routing and serves immutable assets with proper cache headers

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # Response compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_comp_level 6;

    # Serve from the mounted volume
    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # IMMUTABLE ASSETS (versioned/hashed filenames)
    # Cache these heavily for 1 year - they have content hashes
    # =========================================================================
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        # These files are revisioned by webpack/vite - cache them forever
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # =========================================================================
    # IMAGE ASSETS
    # Cache for 30 days
    # =========================================================================
    location ~* \.(gif|jpe?g|png|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # =========================================================================
    # Static assets directory
    # Cache for 7 days
    # =========================================================================
    location ~* ^/static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # =========================================================================
    # HTML files and index.html
    # Don't cache HTML - always fetch latest to get updates and new asset hashes
    # =========================================================================
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "public, must-revalidate, max-age=0";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # =========================================================================
    # CLIENT-SIDE ROUTING
    # For SPA: route all non-file requests to index.html
    # SvelteKit router will handle the navigation
    # =========================================================================
    location / {
        # Check if file exists; if not, serve index.html for SPA routing
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # SECURITY HEADERS
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================================================================
    # ERROR PAGES
    # Route to index.html to let SvelteKit handle error pages
    # =========================================================================
    error_page 404 /index.html;

    # =========================================================================
    # DENY ACCESS TO HIDDEN FILES
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}