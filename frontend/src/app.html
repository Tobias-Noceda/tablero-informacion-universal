<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<script>
			// The app's own theme (cookie tiu-theme, see $lib/helpers/theme), set
			// before the first paint so a dark choice never flashes light.
			(function () {
				var match = document.cookie.match(/(?:^|;\s*)tiu-theme=(light|dark)(?:;|$)/);
				if (match) document.documentElement.dataset.theme = match[1];
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
