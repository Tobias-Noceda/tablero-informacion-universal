name: Go tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Vet (integration tag)
        run: go vet -tags integration ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo '### Go coverage'
              echo '```'
              go tool cover -func=coverage.out | tail -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  integration:
    name: integration (Mongo, Redis, mock OAuth2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The real stores the integration tests run against, as on Docker. In CI a
    # store that does not answer fails the tests (CI=true) instead of skipping
    # them.
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mock-oauth2:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        ports:
          - 8899:8080

    env:
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      MONGO_DATABASE: it
      REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate a master key for this run
        run: echo "SECRETS_MASTER_KEYS=1:$(head -c 32 /dev/urandom | base64)" >> "$GITHUB_ENV"

      - name: Wait for mock OAuth2 provider
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8899/default/.well-known/openid-configuration && exit 0
            sleep 1
          done
          echo "mock-oauth2 did not come up" >&2
          exit 1

      # Every integration test; packages share one database, so one at a time.
      # TestLiveDuende reaches a public demo server and stays out of CI.
      - name: Test
        run: |
          set -o pipefail
          go test -race -tags integration -count=1 -p 1 -skip 'TestLiveDuende' -v ./... 2>&1 | tee integration.log

      - name: Summary
        if: always()
        run: |
          {
            echo '### Go integration tests'
            echo "passed: $(grep -c -- '--- PASS' integration.log || true), failed: $(grep -c -- '--- FAIL' integration.log || true), skipped: $(grep -c -- '--- SKIP' integration.log || true)"
          } >> "$GITHUB_STEP_SUMMARY"
