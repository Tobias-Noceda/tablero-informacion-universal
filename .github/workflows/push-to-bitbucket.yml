name: Mirror to Bitbucket
 
on:
  push:
    branches:
      - '**' 
    tags:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to Bitbucket
        env:
          BB_EMAIL: ${{ secrets.BITBUCKET_EMAIL }}
          BB_TOKEN: ${{ secrets.BITBUCKET_API_TOKEN }}
        run: |
          ENC_EMAIL=$(printf '%s' "$BB_EMAIL" | sed 's/@/%40/')
          git clone --mirror "https://github.com/${{ github.repository }}.git" repo.git
          cd repo.git
          git push --mirror \
            "https://${ENC_EMAIL}:${BB_TOKEN}@bitbucket.org/itba/pf-2026a-tablero-informacion-universal.git"