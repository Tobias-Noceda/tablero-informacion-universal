name: Build LaTeX document

on:
  push:
    # paths:
    #   - docs/main.tex
    paths-ignore:
      - docs/informe.pdf

env:
  DOCS: docs
  ENTRYPOINT: main.tex
  OUTPUT: main.pdf
  INFORME: informe.pdf

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: $DOCS
          root_file: $ENTRYPOINT

      - uses: actions/upload-artifact@v7
        with:
          name: informe
          path: $DOCS/$OUTPUT

  commit:
    runs-on: ubuntu-slim
    needs:
      - build_latex

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: informe
          path: $DOCS

      - name: Add & Commit
        uses: EndBug/add-and-commit@v11
        with:
          cwd: $DOCS
          add: -f $INFORME
          message: 'Re-compiled $INFORME'
