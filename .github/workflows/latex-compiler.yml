name: Build LaTeX document

on:
  push:
    # paths:
    #   - docs/main.tex
    paths-ignore:
      - docs/informe.pdf

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: docs
          root_file: main.tex

      - uses: actions/upload-artifact@v7
        with:
          name: informe
          path: docs/main.pdf

  commit:
    runs-on: ubuntu-slim
    needs:
      - build_latex

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: informe
          path: docs/informe.pdf

      - name: Add & Commit
        uses: EndBug/add-and-commit@v11
        with:
          add: -f docs/informe.pdf
          message: 'Re-compiled informe.pdf'
