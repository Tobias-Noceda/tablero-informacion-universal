name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:

# Same pattern as the other workflows: a pull request has its own group and
# cancels its older runs; every merge to main gets tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: playwright against the Docker stack
    # Playwright 1.60 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # A throwaway stack: generated secrets, mails to the log (no Resend key),
      # a database of its own and plain-HTTP cookies on localhost.
      - name: Write the stack's .env
        run: |
          key() { head -c 32 /dev/urandom | base64; }
          {
            echo "MONGO_INITDB_ROOT_USERNAME=e2e"
            echo "MONGO_INITDB_ROOT_PASSWORD=$(head -c 16 /dev/urandom | xxd -p)"
            echo "REDIS_PASSWORD=$(head -c 16 /dev/urandom | xxd -p)"
            echo "MONGO_DATABASE=e2e_ui"
            echo "SECRETS_MASTER_KEYS=1:$(key)"
            echo "AUTH_SIGNING_KEYS=e2e:$(key)"
            echo "AUTH_COOKIE_SECURE=false"
          } > .env

      # With perf's overlay: the fake data source the card tests fetch.
      - name: Start the stack
        run: docker compose -f docker-compose.yaml -f perf/docker-compose.perf.yaml up -d --build

      - name: Wait for the backend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost/api/v1/health && exit 0
            sleep 2
          done
          docker compose ps
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.6.0 --activate

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        working-directory: frontend
        run: pnpm test:e2e

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yaml -f perf/docker-compose.perf.yaml logs --no-color --tail 200 backend realtime alb source

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
