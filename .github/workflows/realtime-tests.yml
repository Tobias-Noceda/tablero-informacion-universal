name: Realtime tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - realtime/**
      - .github/workflows/realtime-tests.yml

# A pull request gets its own group (by number: a run that starts after the
# merge would otherwise fall back to the base branch's ref and cancel its
# runs). Only pull requests cancel: on main every merge gets tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Same pinned pnpm as the Dockerfile (the lockfile was written by it)
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.4.2 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
